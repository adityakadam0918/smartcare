<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare - Enterprise Healthcare Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca'}}}}};
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-full text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
<div id="root" class="min-h-full flex flex-col"></div>

<script type="text/babel">
const {useState,useEffect,useRef}=React;

const USERS_TABLE=[
 {email:"patient1@smartcare.com",password:"password123",role:"Patient"},
 {email:"patient2@smartcare.com",password:"password123",role:"Patient"}
];
const DOCTOR_TABLE=[
 {id:"DOC101",email:"doc1@smartcare.com",password:"password123",name:"Dr. Rajesh Deshmukh",specialty:"Cardiology",location:"Mumbai, MH",fee:1500,rating:4.9,reviewCount:128,experience:12,bio:"Specialist in preventative cardiology and arrhythmia management."},
 {id:"DOC102",email:"doc2@smartcare.com",password:"password123",name:"Dr. Ananya Kulkarni",specialty:"Dermatology",location:"Pune, MH",fee:1200,rating:4.8,reviewCount:94,experience:8,bio:"Focused on surgical dermatology, eczema, and skin conditions."},
 {id:"DOC103",email:"doc3@smartcare.com",password:"password123",name:"Dr. Vikram Jadhav",specialty:"Neurology",location:"Kolhapur, MH",fee:1800,rating:4.9,reviewCount:210,experience:15,bio:"Expert in migraine treatment and neuro-rehabilitation."}
];
const LAB_TESTS_TABLE=[
 {id:"LAB1",name:"Comprehensive Full Body Health Checkup",includes:"75 tests including Thyroid, Diabetes, Lipid Profile, Liver & Kidney Function",price:1499,originalPrice:2998},
 {id:"LAB2",name:"Advanced Diabetes Care Panel",includes:"HbA1c, Fasting Blood Glucose, Average Blood Glucose, Lipid Profile",price:699,originalPrice:1398},
 {id:"LAB3",name:"Complete Thyroid Function Test",includes:"T3, T4, TSH (Sensitive)",price:499,originalPrice:998}
];
const ADMIN_TABLE=[{id:"ADM001",email:"admin@smartcare.com",password:"password123"}];
const INITIAL_APPOINTMENTS=[
 {id:101,patientName:"Aarav Sharma",doctorId:"DOC101",doctorName:"Dr. Rajesh Deshmukh",specialty:"Cardiology",date:"2026-08-15",time:"10:00 AM",status:"approved",symptoms:"Mild chest tightness after exercise",paid:true,prescription:"Aspirin 81mg daily, Routine ECG recommended.",consultType:"Video Consultation"}
];
const SPECIALTY_RULES={
 Cardiology:["chest pain","palpitations","shortness of breath","high blood pressure","dizziness","chest tightness"],
 Dermatology:["rash","skin itch","acne","mole changes","eczema","red spots","itching"],
 Neurology:["migraine","severe headache","numbness","seizure","memory loss","dizziness"],
 Orthopedics:["joint pain","bone fracture","back pain","knee swelling","sprain","bone"],
 "General Medicine":["fever","cough","fatigue","sore throat","cold","flu"]
};

function Icon({name,className="w-4 h-4"}) {
 return <i data-lucide={name} className={className}></i>;
}

function App(){
 const [isAuthenticated,setIsAuthenticated]=useState(false);
 const [role,setRole]=useState("Patient"),[userEmail,setUserEmail]=useState(""),[userId,setUserId]=useState("");
 const [loginRoleSelect,setLoginRoleSelect]=useState("Patient"),[loginEmailInput,setLoginEmailInput]=useState(""),[loginPasswordInput,setLoginPasswordInput]=useState(""),[roleSpecificIdInput,setRoleSpecificIdInput]=useState(""),[loginError,setLoginError]=useState(false),[toastMessage,setToastMessage]=useState("");
 const [activeTab,setActiveTab]=useState("search"),[doctors,setDoctors]=useState(DOCTOR_TABLE),[appointments,setAppointments]=useState(INITIAL_APPOINTMENTS);
 const [selectedSpecialty,setSelectedSpecialty]=useState("All"),[searchQuery,setSearchQuery]=useState("");
 const [isSymptomModalOpen,setIsSymptomModalOpen]=useState(false),[bookingDoctor,setBookingDoctor]=useState(null),[ratingAppointment,setRatingAppointment]=useState(null);
 const [selectedLabTest,setSelectedLabTest]=useState(null);
 const [symptomInput,setSymptomInput]=useState(""),[aiAnalysis,setAiAnalysis]=useState(null);
 const [bookingDate,setBookingDate]=useState("2026-08-16"),[bookingTime,setBookingTime]=useState("10:00 AM"),[bookingSymptoms,setBookingSymptoms]=useState(""),[isPayingOnline,setIsPayingOnline]=useState(true),[isPaymentProcessing,setIsPaymentProcessing]=useState(false);
 const [consultationMode,setConsultationMode]=useState("Video Consultation");
 const [userRating,setUserRating]=useState(5),[userReview,setUserReview]=useState("");
 const [darkMode,setDarkMode]=useState(false);

 // Profile Customization States
 const [profileName,setProfileName]=useState("Aarav Sharma");
 const [profileAge,setProfileAge]=useState("28");
 const [profileGender,setProfileGender]=useState("Male");

 // Settings Customization States
 const [emailNotifications,setEmailNotifications]=useState(true);
 const [smsNotifications,setSmsNotifications]=useState(true);
 const [autoAcceptReports,setAutoAcceptReports]=useState(false);
 const [languagePreference,setLanguagePreference]=useState("English");
 const [dataSharing,setDataSharing]=useState(true);

 const appointmentChartRef=useRef(null),specialtyChartRef=useRef(null),chartInstances=useRef({});

 useEffect(()=>{if(window.lucide) window.lucide.createIcons();});

 useEffect(()=>{
   if(darkMode){
     document.documentElement.classList.add('dark','bg-slate-900');
     document.documentElement.classList.remove('bg-slate-50');
   } else {
     document.documentElement.classList.remove('dark','bg-slate-900');
     document.documentElement.classList.add('bg-slate-50');
   }
 },[darkMode]);

 const triggerToast=msg=>{
   setToastMessage(msg);
   setTimeout(()=>setToastMessage(""),3000);
 };

 useEffect(()=>{
   if(isAuthenticated&&role==="Admin"&&activeTab==="dashboard"){
     Object.values(chartInstances.current).forEach(c=>c?.destroy());
     if(appointmentChartRef.current) chartInstances.current.appChart=new Chart(appointmentChartRef.current,{
       type:"bar",
       data:{labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],datasets:[{label:"Appointments",data:[12,19,15,22,18,8,5],backgroundColor:"#6366f1",borderRadius:8}]},
       options:{responsive:true,maintainAspectRatio:false}
     });
     if(specialtyChartRef.current) chartInstances.current.specChart=new Chart(specialtyChartRef.current,{
       type:"doughnut",
       data:{labels:["Cardiology","Dermatology","Neurology","Orthopedics","General Medicine"],datasets:[{data:[30,25,15,10,20],backgroundColor:["#4f46e5","#ec4899","#8b5cf6","#f59e0b","#10b981"]}]},
       options:{responsive:true,maintainAspectRatio:false}
     });
   }
 },[isAuthenticated,role,activeTab]);

 const handleAuthLogin=e=>{
   e.preventDefault();setLoginError(false);
   const email=loginEmailInput.trim(),password=loginPasswordInput.trim(),idVal=roleSpecificIdInput.trim();

   if(loginRoleSelect==="Patient"){
     const valid=USERS_TABLE.find(u=>u.email===email&&u.password===password)||(email&&password==="password123");
     if(valid){
       setRole("Patient");setUserEmail(email);setIsAuthenticated(true);setActiveTab("search");
       triggerToast("Welcome Patient! 50% OFF applied on your first booking.");
     } else setLoginError(true);
   }else if(loginRoleSelect==="Doctor"){
     const d=DOCTOR_TABLE.find(x=>x.id===idVal&&x.email===email&&x.password===password);
     if(d){
       setRole("Doctor");setUserEmail(email);setUserId(d.id);setIsAuthenticated(true);setActiveTab("dashboard");
       triggerToast(`Logged in successfully as ${d.id}`);
     } else setLoginError(true);
   }else{
     const a=ADMIN_TABLE.find(x=>x.id===idVal&&x.email===email&&x.password===password);
     if(a){
       setRole("Admin");setUserEmail(email);setUserId(a.id);setIsAuthenticated(true);setActiveTab("dashboard");
       triggerToast("Administrator Access Granted");
     } else setLoginError(true);
   }
 };

 const handleLogout=()=>{
   setIsAuthenticated(false);setLoginEmailInput("");setLoginPasswordInput("");setRoleSpecificIdInput("");setLoginError(false);
   triggerToast("Logged out successfully");
 };

 const handleSymptomAnalysis=()=>{
   if(!symptomInput.trim()) return;
   const text=symptomInput.toLowerCase();let best="General Medicine",max=0;
   Object.entries(SPECIALTY_RULES).forEach(([spec,words])=>{
     const count=words.filter(w=>text.includes(w)).length;
     if(count>max){max=count;best=spec;}
   });
   const confidence=max===0?.60:Math.min(.70+max*.10,.98);
   setAiAnalysis({specialty:best,confidence:Math.round(confidence*100)});
 };

 const filteredDoctors=doctors.filter(d=>
   (selectedSpecialty==="All"||d.specialty===selectedSpecialty)&&
   [d.name,d.specialty,d.location].some(v=>v.toLowerCase().includes(searchQuery.toLowerCase()))
 );

 const finalizeBooking=paid=>{
   const effectiveFee=bookingDoctor?Math.round(bookingDoctor.fee*0.5):(selectedLabTest?Math.round(selectedLabTest.price*0.5):0);
   const itemTitle=bookingDoctor?bookingDoctor.name:selectedLabTest.name;
   const a={
     id:Date.now(),
     patientName:profileName||userEmail.split("@")[0],
     doctorId:bookingDoctor?bookingDoctor.id:"LAB",
     doctorName:itemTitle,
     specialty:bookingDoctor?bookingDoctor.specialty:"Lab Test Booking",
     date:bookingDate,time:bookingTime,status:"approved",
     symptoms:bookingSymptoms||"First booking promo applied (50% OFF)",
     paid,prescription:null,consultType:consultationMode
   };
   setAppointments(prev=>[a,...prev]);
   setBookingDoctor(null);setSelectedLabTest(null);setBookingSymptoms("");
   setActiveTab("dashboard");
   triggerToast(`Booking confirmed! ₹${effectiveFee} paid/confirmed with 50% discount.`);
 };

 const handleCreateBooking=e=>{
   e.preventDefault();
   if(isPayingOnline){
     setIsPaymentProcessing(true);
     setTimeout(()=>{finalizeBooking(true);setIsPaymentProcessing(false)},1200);
   }else finalizeBooking(false);
 };

 const handleStatusChange=(id,status)=>setAppointments(prev=>prev.map(a=>a.id===id?{...a,status}:a));

 const handleReviewSubmit=e=>{
   e.preventDefault();
   if(ratingAppointment.doctorId!=="LAB"){
     setDoctors(prev=>prev.map(d=>{
       if(d.id!==ratingAppointment.doctorId)return d;
       const n=d.reviewCount+1;
       return {...d,rating:Number(((d.rating*d.reviewCount+userRating)/n).toFixed(1)),reviewCount:n};
     }));
   }
   setAppointments(prev=>prev.map(a=>a.id===ratingAppointment.id?{...a,rated:true}:a));
   setRatingAppointment(null);setUserReview("");setUserRating(5);
   triggerToast("Review submitted successfully!");
 };

 if(!isAuthenticated) return <div className="flex-1 flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-900">
   <div className="max-w-md w-full bg-white dark:bg-slate-800 dark:border-slate-700 rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6 relative">
    <div className="absolute top-4 left-4 w-10 h-10 rounded-xl overflow-hidden flex items-center justify-center bg-brand-600 shadow-md">
      <img src="Copilot_20260811_150333.png" alt="SmartCare Logo" className="w-full h-full object-cover"/>
    </div>
    <div className="text-center space-y-2 pt-2">
      <div className="inline-flex w-16 h-16 rounded-2xl overflow-hidden shadow-md mx-auto items-center justify-center bg-brand-600">
        <img src="Copilot_20260811_150333.png" alt="SmartCare Logo" className="w-full h-full object-cover"/>
      </div>
      <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">SmartCare Portal Login</h1>
      <p className="text-xs text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-900/30 py-1.5 px-3 rounded-lg">🎉 Special Offer: Get 50% OFF on your 1st Booking & Lab Test!</p>
    </div>
    {loginError&&<div className="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl text-center font-semibold">Invalid ID or Password</div>}
    <form onSubmit={handleAuthLogin} className="space-y-4">
      <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Select Role</label><select value={loginRoleSelect} onChange={e=>setLoginRoleSelect(e.target.value)} className="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white border border-slate-200 rounded-xl text-sm"><option>Patient</option><option>Doctor</option><option>Admin</option></select></div>
      <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label><input type="email" required placeholder="name@example.com" value={loginEmailInput} onChange={e=>setLoginEmailInput(e.target.value)} className="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl text-sm"/></div>
      <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label><input type="password" required placeholder="••••••••" value={loginPasswordInput} onChange={e=>setLoginPasswordInput(e.target.value)} className="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl text-sm"/></div>
      {loginRoleSelect!=="Patient"&&<div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">{loginRoleSelect==="Doctor"?"Doctor ID":"Admin ID"}</label><input required placeholder={loginRoleSelect==="Doctor"?"DOC101":"ADM001"} value={roleSpecificIdInput} onChange={e=>setRoleSpecificIdInput(e.target.value)} className="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl text-sm font-mono"/></div>}
      <button className="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl text-sm shadow-md">Access Dashboard</button>
    </form>
    <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl text-xs text-slate-500 dark:text-slate-400 space-y-1 border border-slate-200 dark:border-slate-700">
      <span className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Demo Credentials:</span>
      <div>• <b>Patient:</b> Any email + password123</div>
      <div>• <b>Doctor:</b> DOC101 | doc1@smartcare.com | password123</div>
      <div>• <b>Admin:</b> ADM001 | admin@smartcare.com | password123</div>
    </div>
   </div>
 </div>;

 return <div className="flex-1 flex flex-col">
  <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
   <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div className="flex items-center gap-3">
      <div className="w-10 h-10 rounded-xl overflow-hidden flex items-center justify-center bg-brand-600 shadow-sm">
        <img src="Copilot_20260811_150333.png" alt="SmartCare Logo" className="w-full h-full object-cover"/>
      </div>
      <div><span className="text-xl font-bold text-slate-900 dark:text-white">SmartCare</span><span className="hidden sm:inline-block ml-2 text-xs bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 px-2 py-0.5 rounded-full font-semibold">Role: {role} {userId?`(${userId})`:""}</span></div>
    </div>
    <nav className="hidden md:flex gap-1">
      {role==="Patient"&&<>
        <button onClick={()=>setActiveTab("search")} className={`px-4 py-2 rounded-lg font-medium text-sm ${activeTab==="search"?"bg-slate-100 dark:bg-slate-700 dark:text-white":"text-slate-600 dark:text-slate-300"}`}>Find Doctors</button>
        <button onClick={()=>setActiveTab("videoConsult")} className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${activeTab==="videoConsult"?"bg-slate-100 dark:bg-slate-700 text-brand-600 dark:text-brand-400":"text-slate-600 dark:text-slate-300"}`}><Icon name="video"/>Video Consult</button>
        <button onClick={()=>setActiveTab("labTests")} className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${activeTab==="labTests"?"bg-slate-100 dark:bg-slate-700 text-brand-600 dark:text-brand-400":"text-slate-600 dark:text-slate-300"}`}><Icon name="flask-conical"/>Lab Tests</button>
        <button onClick={()=>setIsSymptomModalOpen(true)} className="px-4 py-2 rounded-lg font-medium text-sm text-brand-600 dark:text-brand-400 hover:bg-brand-50 dark:hover:bg-slate-700 flex items-center gap-1.5"><Icon name="sparkles"/>AI Symptom Checker</button>
      </>}
      <button onClick={()=>setActiveTab("dashboard")} className={`px-4 py-2 rounded-lg font-medium text-sm ${activeTab==="dashboard"?"bg-slate-100 dark:bg-slate-700 dark:text-white":"text-slate-600 dark:text-slate-300"}`}>Dashboard</button>
      {role==="Patient"&&<button onClick={()=>setActiveTab("history")} className={`px-4 py-2 rounded-lg font-medium text-sm ${activeTab==="history"?"bg-slate-100 dark:bg-slate-700 dark:text-white":"text-slate-600 dark:text-slate-300"}`}>Medical Records</button>}
      <button onClick={()=>setActiveTab("profile")} className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${activeTab==="profile"?"bg-slate-100 dark:bg-slate-700 text-brand-600 dark:text-brand-400":"text-slate-600 dark:text-slate-300"}`}><Icon name="user"/>Profile</button>
      <button onClick={()=>setActiveTab("settings")} className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${activeTab==="settings"?"bg-slate-100 dark:bg-slate-700 text-brand-600 dark:text-brand-400":"text-slate-600 dark:text-slate-300"}`}><Icon name="settings"/>Settings</button>
    </nav>
    <div className="flex items-center gap-3">
      {/* Email and Sign out removed from top right corner as requested */}
    </div>
   </div>
  </header>

  <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
   {role==="Patient"&&activeTab==="search"&&<section className="space-y-6">
    <div className="bg-gradient-to-r from-brand-600 to-indigo-800 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
      <div>
        <span className="bg-amber-400 text-slate-900 font-extrabold text-xs px-3 py-1 rounded-full uppercase tracking-wider">SmartCare Special Offer</span>
        <h1 className="text-3xl sm:text-4xl font-extrabold mt-2">Get 50% OFF on your 1st Booking & Lab Test!</h1>
        <p className="text-brand-100 text-sm sm:text-base mt-2">Search certified specialists across Mumbai, Pune, and Kolhapur, book video consultations instantly, and order home sample collection lab tests.</p>
        <button onClick={()=>setIsSymptomModalOpen(true)} className="mt-5 bg-white text-brand-700 font-semibold px-5 py-2.5 rounded-xl flex items-center gap-2 text-sm shadow-md"><Icon name="bot"/>Analyze Symptoms with AI</button>
      </div>
      <div className="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 text-center min-w-[240px]"><span className="text-xs uppercase tracking-widest text-brand-200 font-bold">Limited Offer</span><div className="text-4xl font-black mt-1 text-white">50% OFF</div><p className="text-xs text-brand-100 mt-1">Automatically applied on your first booking</p></div>
    </div>

    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div onClick={()=>setActiveTab("search")} className="bg-white dark:bg-slate-800 dark:border-slate-700 p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-brand-500 cursor-pointer flex items-center gap-4 transition-all"><div className="bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 p-3 rounded-xl"><Icon name="user-check" className="w-6 h-6"/></div><div><h4 className="font-bold text-slate-900 dark:text-white text-sm">Doctors</h4><p className="text-xs text-slate-500 dark:text-slate-400">Book physical visit</p></div></div>
      <div onClick={()=>setActiveTab("videoConsult")} className="bg-white dark:bg-slate-800 dark:border-slate-700 p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-brand-500 cursor-pointer flex items-center gap-4 transition-all"><div className="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 p-3 rounded-xl"><Icon name="video" className="w-6 h-6"/></div><div><h4 className="font-bold text-slate-900 dark:text-white text-sm">Video Consult</h4><p className="text-xs text-slate-500 dark:text-slate-400">Connect in 60 secs</p></div></div>
      <div onClick={()=>setActiveTab("labTests")} className="bg-white dark:bg-slate-800 dark:border-slate-700 p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-brand-500 cursor-pointer flex items-center gap-4 transition-all"><div className="bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 p-3 rounded-xl"><Icon name="flask-conical" className="w-6 h-6"/></div><div><h4 className="font-bold text-slate-900 dark:text-white text-sm">Lab Tests</h4><p className="text-xs text-slate-500 dark:text-slate-400">Safe home sample pickup</p></div></div>
      <div onClick={()=>setIsSymptomModalOpen(true)} className="bg-white dark:bg-slate-800 dark:border-slate-700 p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-brand-500 cursor-pointer flex items-center gap-4 transition-all"><div className="bg-amber-50 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 p-3 rounded-xl"><Icon name="sparkles" className="w-6 h-6"/></div><div><h4 className="font-bold text-slate-900 dark:text-white text-sm">AI Triage</h4><p className="text-xs text-slate-500 dark:text-slate-400">Symptom check assistant</p></div></div>
    </div>

    <div className="flex flex-col sm:flex-row gap-4 justify-between items-center bg-white dark:bg-slate-800 dark:border-slate-700 p-4 rounded-2xl border border-slate-200 shadow-sm">
      <div className="w-full sm:w-auto flex-1 max-w-md relative"><input placeholder="Search doctor name or city..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl text-sm"/><Icon name="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400"/></div>
      <div className="w-full sm:w-auto flex items-center gap-2 overflow-x-auto pb-1"><span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Specialty:</span>{["All",...Object.keys(SPECIALTY_RULES)].map(s=><button key={s} onClick={()=>setSelectedSpecialty(s)} className={`text-xs px-3 py-1.5 rounded-lg font-medium whitespace-nowrap ${selectedSpecialty===s?"bg-brand-600 text-white":"bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"}`}>{s}</button>)}</div>
    </div>

    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{filteredDoctors.map(doc=><div key={doc.id} className="bg-white dark:bg-slate-800 dark:border-slate-700 rounded-2xl border border-slate-200 p-6 flex flex-col justify-between hover:shadow-lg relative overflow-hidden">
      <div className="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl">50% OFF 1st Booking</div>

  {isSymptomModalOpen&&<div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-slate-800 dark:border-slate-700 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl"><div className="flex justify-between"><h3 className="font-bold text-lg flex gap-2 text-slate-900 dark:text-white"><Icon name="sparkles"/>AI Symptom Triage Assistant</h3><button onClick={()=>{setIsSymptomModalOpen(false);setAiAnalysis(null)}} className="text-slate-500 dark:text-slate-400"><Icon name="x"/></button></div><p className="text-xs text-slate-500 dark:text-slate-400">Describe your symptoms to get matched with a medical specialty.</p><textarea rows="3" value={symptomInput} onChange={e=>setSymptomInput(e.target.value)} placeholder="e.g. Sharp chest tightness and shortness of breath..." className="w-full p-3 border dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl text-sm"/><button onClick={handleSymptomAnalysis} className="w-full bg-brand-600 text-white font-semibold py-2.5 rounded-xl">Analyze Symptoms</button>{aiAnalysis&&<div className="bg-brand-50 dark:bg-brand-900/40 border dark:border-slate-700 p-4 rounded-xl text-xs space-y-2"><b className="text-slate-900 dark:text-white">Recommended Specialty: {aiAnalysis.specialty}</b><div className="text-slate-700 dark:text-slate-300">Confidence Match Score: {aiAnalysis.confidence}%</div><button onClick={()=>{setSelectedSpecialty(aiAnalysis.specialty);setIsSymptomModalOpen(false);setAiAnalysis(null);setActiveTab("search")}} className="w-full bg-brand-600 text-white font-bold py-2 rounded-lg">View Specialists in {aiAnalysis.specialty}</button></div>}</div></div>}

  {(bookingDoctor||selectedLabTest)&&<div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-slate-800 dark:border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
    <div className="flex justify-between"><h3 className="font-bold text-lg text-slate-900 dark:text-white">{bookingDoctor?`Book ${consultationMode}`:"Book Lab Sample Pickup"}</h3><button onClick={()=>{setBookingDoctor(null);setSelectedLabTest(null)}} className="text-slate-500 dark:text-slate-400"><Icon name="x"/></button></div>
    <div className="bg-amber-50 dark:bg-amber-900/40 border border-amber-200 dark:border-amber-700 p-3 rounded-xl text-xs text-amber-800 dark:text-amber-300">🎉 <b>50% First Booking / Section Discount Applied!</b></div>
    <div className="text-xs text-slate-500 dark:text-slate-400">{bookingDoctor?<>Booking with <b className="text-slate-900 dark:text-white">{bookingDoctor.name}</b> ({bookingDoctor.specialty}) • <span className="line-through">₹{bookingDoctor.fee}</span> <span className="text-emerald-600 dark:text-emerald-400 font-bold">₹{Math.round(bookingDoctor.fee*.5)}</span></>:<>Lab Test: <b className="text-slate-900 dark:text-white">{selectedLabTest.name}</b> • <span className="line-through">₹{selectedLabTest.price}</span> <span className="text-emerald-600 dark:text-emerald-400 font-bold">₹{Math.round(selectedLabTest.price*.5)}</span></>}</div>
    {isPaymentProcessing?<div className="py-12 text-center"><div className="w-10 h-10 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto"/><p className="text-sm font-semibold mt-4 text-slate-900 dark:text-white">Processing Secure UPI / Card Gateway...</p></div>:
    <form onSubmit={handleCreateBooking} className="space-y-3 text-xs">
      <div><label className="font-semibold text-slate-700 dark:text-slate-300">Preferred Date</label><input type="date" value={bookingDate} onChange={e=>setBookingDate(e.target.value)} required className="w-full mt-1 p-2 border dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl"/></div>
      <div><label className="font-semibold text-slate-700 dark:text-slate-300">Time Slot</label><select value={bookingTime} onChange={e=>setBookingTime(e.target.value)} className="w-full mt-1 p-2 border dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl"><option>09:00 AM</option><option>10:00 AM</option><option>02:30 PM</option><option>04:00 PM</option></select></div>
      <div><label className="font-semibold text-slate-700 dark:text-slate-300">{bookingDoctor?"Describe Symptoms / Reason":"Patient Address / Notes"}</label><textarea rows="2" value={bookingSymptoms} onChange={e=>setBookingSymptoms(e.target.value)} className="w-full mt-1 p-2 border dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl" placeholder={bookingDoctor?"e.g. mild fever, consultation needed":"Enter complete address for home sample collection"}/></div>
      <div className="grid grid-cols-2 gap-2"><button type="button" onClick={()=>setIsPayingOnline(true)} className={`p-2 rounded-xl border font-bold ${isPayingOnline?"border-brand-600 bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300":"dark:border-slate-700 text-slate-700 dark:text-slate-300"}`}>Pay Online</button><button type="button" onClick={()=>setIsPayingOnline(false)} className={`p-2 rounded-xl border font-bold ${!isPayingOnline?"border-brand-600 bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300":"dark:border-slate-700 text-slate-700 dark:text-slate-300"}`}>Pay Later</button></div>
      {isPayingOnline&&<input required placeholder="Enter UPI ID or Card Number" className="w-full p-2.5 border dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl"/>}
      <button type="submit" className="w-full bg-slate-900 dark:bg-slate-700 text-white py-3 rounded-xl font-bold">{isPayingOnline?`Pay ₹${bookingDoctor?Math.round(bookingDoctor.fee*.5):Math.round(selectedLabTest.price*.5)} & Confirm`:"Confirm Booking"}</button>
    </form>}
  </div></div>}

  {ratingAppointment&&<div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-slate-800 dark:border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl"><div className="flex justify-between"><h3 className="font-bold text-lg text-slate-900 dark:text-white">Rate Your Experience</h3><button onClick={()=>setRatingAppointment(null)} className="text-slate-500 dark:text-slate-400"><Icon name="x"/></button></div><form onSubmit={handleReviewSubmit} className="space-y-4 text-xs"><p className="text-slate-500 dark:text-slate-400">With {ratingAppointment.doctorName}</p><div><label className="font-semibold block text-slate-700 dark:text-slate-300">Rating Stars</label><div className="flex gap-2">{[1,2,3,4,5].map(s=><button type="button" key={s} onClick={()=>setUserRating(s)} className={`text-2xl ${userRating>=s?"text-amber-500":"text-slate-300 dark:text-slate-600"}`}>★</button>)}</div></div><textarea rows="3" required value={userReview} onChange={e=>setUserReview(e.target.value)} className="w-full p-2 border dark:border-slate-700 dark:bg-slate-900 dark:text-white rounded-xl" placeholder="Share your experience..."/><button className="w-full bg-brand-600 text-white font-semibold py-2.5 rounded-xl">Submit Feedback</button></form></div></div>}

  {toastMessage&&<div className="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl z-[60] text-xs border-l-4 border-emerald-400">{toastMessage}</div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
