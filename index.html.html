<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare Healthcare</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{brand:{50:"#eef2ff",100:"#e0e7ff",500:"#6366f1",600:"#4f46e5",700:"#4338ca"}}}}}
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const DOCTORS=[
{id:1,name:"Dr. Rajesh Deshmukh",specialty:"Cardiology",location:"Mumbai, MH",fee:1500,rating:4.9,reviews:128,experience:12,bio:"Specialist in preventative cardiology and arrhythmia management."},
{id:2,name:"Dr. Ananya Kulkarni",specialty:"Dermatology",location:"Pune, MH",fee:1200,rating:4.8,reviews:94,experience:8,bio:"Focused on surgical dermatology, eczema, and skin conditions."},
{id:3,name:"Dr. Vikram Jadhav",specialty:"Neurology",location:"Kolhapur, MH",fee:1800,rating:4.9,reviews:210,experience:15,bio:"Expert in migraine treatment and neuro-rehabilitation."},
{id:4,name:"Dr. Amit Shinde",specialty:"Orthopedics",location:"Mumbai, MH",fee:1600,rating:4.7,reviews:88,experience:10,bio:"Specializing in joint replacement and sports injury recovery."},
{id:5,name:"Dr. Priya Patil",specialty:"General Medicine",location:"Kolhapur, MH",fee:800,rating:4.9,reviews:340,experience:6,bio:"Comprehensive primary care, chronic illness management, and preventative health."}
];

const INITIAL_APPOINTMENTS=[
{id:101,patient:"Aarav Sharma (You)",doctorId:1,doctor:"Dr. Rajesh Deshmukh",specialty:"Cardiology",date:"2026-08-15",time:"10:00 AM",status:"approved",symptoms:"Mild chest tightness after exercise",paid:true,prescription:"Aspirin 81mg daily, Routine ECG recommended.",rated:false},
{id:102,patient:"Aarav Sharma (You)",doctorId:2,doctor:"Dr. Ananya Kulkarni",specialty:"Dermatology",date:"2026-08-02",time:"02:30 PM",status:"completed",symptoms:"Persistent skin rash on forearms",paid:true,prescription:"Hydrocortisone cream 1% twice daily for 7 days.",rated:false},
{id:103,patient:"Neha Joshi",doctorId:3,doctor:"Dr. Vikram Jadhav",specialty:"Neurology",date:"2026-08-10",time:"11:00 AM",status:"pending",symptoms:"Frequent migraines with aura",paid:false,prescription:null,rated:false}
];

const RULES={
Cardiology:["chest pain","palpitations","shortness of breath","high blood pressure","dizziness","chest tightness"],
Dermatology:["rash","skin itch","acne","mole changes","eczema","red spots","itching"],
Neurology:["migraine","severe headache","numbness","seizure","memory loss","dizziness"],
Orthopedics:["joint pain","bone fracture","back pain","knee swelling","sprain","bone"],
"General Medicine":["fever","cough","fatigue","sore throat","cold","flu"]
};

function Icon({name,size=16}){return <i data-lucide={name} style={{width:size,height:size}}/>}

function App(){
const [role,setRole]=useState("patient"),[tab,setTab]=useState("search");
const [doctors,setDoctors]=useState(DOCTORS),[appointments,setAppointments]=useState(INITIAL_APPOINTMENTS);
const [specialty,setSpecialty]=useState("All"),[query,setQuery]=useState("");
const [symptomOpen,setSymptomOpen]=useState(false),[symptoms,setSymptoms]=useState(""),[analysis,setAnalysis]=useState(null);
const [booking,setBooking]=useState(null),[date,setDate]=useState("2026-08-16"),[time,setTime]=useState("10:00 AM"),[payOnline,setPayOnline]=useState(true),[processing,setProcessing]=useState(false),[bookingSymptoms,setBookingSymptoms]=useState("");
const [rating,setRating]=useState(null),[stars,setStars]=useState(5),[review,setReview]=useState("");
const appChart=useRef(null),specChart=useRef(null),charts=useRef({});

useEffect(()=>{if(window.lucide)lucide.createIcons()},[role,tab,symptomOpen,booking,rating,analysis,appointments,doctors]);

useEffect(()=>{
if(role==="admin"&&tab==="dashboard"){
if(charts.current.a)charts.current.a.destroy(); if(charts.current.s)charts.current.s.destroy();
if(appChart.current)charts.current.a=new Chart(appChart.current,{type:"bar",data:{labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],datasets:[{label:"Appointments",data:[12,19,15,22,18,8,5],backgroundColor:"#6366f1",borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false}});
if(specChart.current)charts.current.s=new Chart(specChart.current,{type:"doughnut",data:{labels:Object.keys(RULES),datasets:[{data:[30,25,15,10,20],backgroundColor:["#4f46e5","#ec4899","#8b5cf6","#f59e0b","#10b981"]}]},options:{responsive:true,maintainAspectRatio:false}});
}},[role,tab]);

const filtered=doctors.filter(d=>(specialty==="All"||d.specialty===specialty)&&[d.name,d.specialty,d.location].some(x=>x.toLowerCase().includes(query.toLowerCase())));

function analyze(){
let t=symptoms.toLowerCase(),scores={};Object.keys(RULES).forEach(s=>scores[s]=RULES[s].filter(k=>t.includes(k)).length);
let best=Object.keys(scores).reduce((a,b)=>scores[b]>scores[a]?b:a,"General Medicine"),max=scores[best];
setAnalysis({specialty:best,confidence:max?Math.min(70+max*10,98):60});
}
function book(e){
e.preventDefault();
if(payOnline){setProcessing(true);setTimeout(()=>finish(true),1200)}else finish(false);
}
function finish(paid){
setAppointments(a=>[{id:Date.now(),patient:"Aarav Sharma (You)",doctorId:booking.id,doctor:booking.name,specialty:booking.specialty,date,time,status:"approved",symptoms:bookingSymptoms,paid,prescription:null,rated:false},...a]);
setBooking(null);setProcessing(false);setBookingSymptoms("");setTab("dashboard");
}
function status(id,s){setAppointments(a=>a.map(x=>x.id===id?{...x,status:s}:x))}
function submitReview(e){
e.preventDefault();
setDoctors(ds=>ds.map(d=>d.id===rating.doctorId?{...d,rating:Number(((d.rating*d.reviews+stars)/(d.reviews+1)).toFixed(1)),reviews:d.reviews+1}:d));
setAppointments(a=>a.map(x=>x.id===rating.id?{...x,rated:true}:x));setRating(null);setReview("");setStars(5);
}
const nav=(t)=>setTab(t);

return <div className="min-h-screen flex flex-col">
<header className="bg-white border-b sticky top-0 z-30 shadow-sm">
<div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<div className="flex items-center gap-3"><div className="bg-brand-600 text-white p-2 rounded-xl"><Icon name="activity" size={24}/></div><div><b className="text-xl">SmartCare</b><span className="hidden sm:inline ml-2 text-xs bg-brand-50 text-brand-700 px-2 py-1 rounded-full">v2.0 Enterprise</span></div></div>
<nav className="hidden md:flex gap-1">
{role==="patient"&&<><button onClick={()=>nav("search")} className={`px-4 py-2 rounded-lg text-sm ${tab==="search"?"bg-slate-100 font-semibold":"text-slate-600"}`}>Find Doctors</button><button onClick={()=>setSymptomOpen(true)} className="px-4 py-2 text-sm text-brand-600 flex gap-2 items-center"><Icon name="sparkles"/>AI Symptom Checker</button></>}
<button onClick={()=>nav("dashboard")} className={`px-4 py-2 rounded-lg text-sm ${tab==="dashboard"?"bg-slate-100 font-semibold":"text-slate-600"}`}>Dashboard</button>
{role==="patient"&&<button onClick={()=>nav("history")} className={`px-4 py-2 rounded-lg text-sm ${tab==="history"?"bg-slate-100 font-semibold":"text-slate-600"}`}>Medical Records</button>}
</nav>
<div className="flex items-center gap-2"><span className="hidden sm:block text-xs text-slate-500">Role View:</span><select value={role} onChange={e=>{setRole(e.target.value);setTab(e.target.value==="patient"?"search":"dashboard")}} className="text-xs bg-slate-100 rounded-lg px-3 py-2 font-semibold"><option value="patient">Patient View</option><option value="doctor">Doctor Portal</option><option value="admin">Administrator</option></select></div>
</div></header>

<main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
{role==="patient"&&tab==="search"&&<section className="space-y-6">
<div className="bg-gradient-to-r from-brand-600 to-indigo-800 rounded-3xl p-8 text-white shadow-xl"><h1 className="text-3xl sm:text-4xl font-extrabold">Find the right care, right when you need it.</h1><p className="mt-3 text-brand-100 max-w-2xl">Search top specialists across Kolhapur, Pune, and Mumbai, schedule consultations online, and pay securely.</p><button onClick={()=>setSymptomOpen(true)} className="mt-5 bg-white text-brand-700 font-semibold px-5 py-2.5 rounded-xl flex gap-2 items-center"><Icon name="bot"/>Analyze Symptoms with AI</button></div>
<div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col sm:flex-row gap-4 justify-between">
<div className="relative flex-1 max-w-md"><Icon name="search" size={16}/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search doctor, city or specialty..." className="w-full pl-10 pr-4 py-2 border rounded-xl text-sm -mt-5"/></div>
<div className="flex gap-2 overflow-auto">{["All",...Object.keys(RULES)].map(s=><button key={s} onClick={()=>setSpecialty(s)} className={`text-xs px-3 py-1.5 rounded-lg whitespace-nowrap ${specialty===s?"bg-brand-600 text-white":"bg-slate-100 text-slate-600"}`}>{s}</button>)}</div></div>
<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{filtered.map(d=><div key={d.id} className="bg-white rounded-2xl border p-6 hover:shadow-lg transition flex flex-col justify-between">
<div><div className="flex justify-between gap-3"><div><h3 className="font-bold text-lg">{d.name}</h3><span className="text-xs font-semibold text-brand-600 bg-brand-50 px-2.5 py-1 rounded-full inline-block mt-1">{d.specialty}</span></div><span className="text-xs font-bold text-amber-500 bg-amber-50 px-2 py-1 rounded-lg">★ {d.rating} ({d.reviews})</span></div><p className="text-xs text-slate-500 mt-4 mb-5">{d.bio}</p><div className="space-y-2 text-xs text-slate-600"><div className="flex gap-2"><Icon name="map-pin"/> {d.location}</div><div className="flex gap-2"><Icon name="award"/> {d.experience} Years Experience</div><div className="flex gap-2"><Icon name="indian-rupee"/> ₹{d.fee} Consultation Fee</div></div></div>
<button onClick={()=>setBooking(d)} className="mt-6 w-full bg-slate-900 text-white py-2.5 rounded-xl text-sm font-medium">Book & Pay Online</button></div>)}</div>
</section>}

{role==="patient"&&tab==="history"&&<section className="space-y-6"><div><h2 className="text-2xl font-bold">Your Medical History</h2><p className="text-sm text-slate-500">Past consultations, doctor notes, and active prescriptions.</p></div>{appointments.filter(a=>a.status==="completed"||a.prescription).map(a=><div key={a.id} className="bg-white p-6 rounded-2xl border shadow-sm"><div className="flex justify-between border-b pb-3"><div><b>{a.doctor}</b><p className="text-xs text-slate-500">{a.specialty} • {a.date}</p></div><span className="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-bold">Completed</span></div><div className="bg-slate-50 p-4 rounded-xl mt-3 text-xs"><b>Prescription & Treatment Notes:</b><p className="italic text-slate-600 mt-2">{a.prescription||"No active prescription notes attached."}</p></div>{!a.rated&&<div className="text-right mt-3"><button onClick={()=>setRating(a)} className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg">★ Leave Feedback & Rating</button></div>}</div>)}</section>}

{tab==="dashboard"&&<section className="space-y-6"><div><h2 className="text-2xl font-bold capitalize">{role} Dashboard</h2><p className="text-sm text-slate-500">Manage system operations, schedules, and analytics.</p></div>
{role==="patient"&&<div className="bg-white rounded-2xl border shadow-sm divide-y">{appointments.map(a=><div key={a.id} className="p-5 flex flex-col sm:flex-row justify-between gap-4"><div><b>{a.doctor}</b><span className="ml-2 text-xs bg-slate-100 px-2 py-1 rounded">{a.specialty}</span><p className="text-xs text-slate-500 mt-2">{a.date} • {a.time} • <span className={a.paid?"text-emerald-600":"text-amber-600"}>{a.paid?"Paid Online":"Pay at Clinic"}</span></p></div><div className="flex gap-2 items-center"><span className={`text-xs px-3 py-1 rounded-full font-bold uppercase ${a.status==="approved"?"bg-emerald-100 text-emerald-800":a.status==="completed"?"bg-blue-100 text-blue-800":"bg-amber-100 text-amber-800"}`}>{a.status}</span>{a.status==="completed"&&!a.rated&&<button onClick={()=>setRating(a)} className="text-xs border px-3 py-1 rounded-lg">Rate Doctor</button>}</div></div>)}</div>}
{role==="doctor"&&<div className="bg-white rounded-2xl border shadow-sm divide-y">{appointments.map(a=><div key={a.id} className="p-5 flex flex-col sm:flex-row justify-between gap-4"><div><b>{a.patient}</b><p className="text-xs text-slate-500">{a.date} at {a.time}</p><p className="text-xs mt-1">Reason: {a.symptoms||"General Checkup"}</p></div><div className="flex gap-2 items-center">{a.status==="pending"&&<><button onClick={()=>status(a.id,"approved")} className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg">Approve</button><button onClick={()=>status(a.id,"cancelled")} className="bg-slate-200 text-xs px-3 py-1.5 rounded-lg">Decline</button></>}{a.status==="approved"&&<button onClick={()=>status(a.id,"completed")} className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">Mark Completed</button>}<span className="text-xs font-bold text-slate-400 uppercase">{a.status}</span></div></div>)}</div>}
{role==="admin"&&<div className="space-y-6"><div className="grid grid-cols-2 lg:grid-cols-4 gap-4">{[["Total Users","1,248"],["Active Doctors",doctors.length],["Appointments",appointments.length],["Gross Revenue","₹14,25,000"]].map(([x,y])=><div className="bg-white p-5 rounded-2xl border shadow-sm" key={x}><span className="text-xs text-slate-500 font-semibold uppercase">{x}</span><p className="text-2xl font-bold mt-1">{y}</p></div>)}</div><div className="grid md:grid-cols-2 gap-6"><div className="bg-white p-6 rounded-2xl border"><h3 className="font-bold text-sm mb-4">Appointments Per Day</h3><div className="h-64"><canvas ref={appChart}/></div></div><div className="bg-white p-6 rounded-2xl border"><h3 className="font-bold text-sm mb-4">Specialty Distribution</h3><div className="h-64"><canvas ref={specChart}/></div></div></div></div>}
</section>}
</main>

<footer className="bg-slate-900 text-slate-300 mt-auto"><div className="max-w-7xl mx-auto px-4 py-10 grid md:grid-cols-4 gap-8"><div><div className="flex gap-2 items-center text-white font-bold text-lg"><span className="bg-brand-600 p-2 rounded-xl"><Icon name="activity"/></span>SmartCare</div><p className="text-xs text-slate-400 mt-4">© 2026 SmartCare | All Rights Reserved</p><p className="text-xs text-brand-400 mt-3">Designed by Aditya Kadam</p></div><div><h4 className="text-xs font-bold text-white uppercase">Contact Info</h4><p className="text-xs text-slate-400 mt-3">support@smartcare.com</p><p className="text-xs text-slate-400 mt-2">+91 98765 43210</p><p className="text-xs text-slate-400 mt-2">Pune, Maharashtra, India</p></div><div><h4 className="text-xs font-bold text-white uppercase">Quick Links</h4><p className="text-xs text-slate-400 mt-3">Home</p><p className="text-xs text-slate-400 mt-2">About</p><p className="text-xs text-slate-400 mt-2">Services</p><p className="text-xs text-slate-400 mt-2">Privacy Policy</p></div><div><h4 className="text-xs font-bold text-white uppercase">Social Media IDs</h4><p className="text-xs text-slate-400 mt-3">facebook: smartcareofficial</p><p className="text-xs text-slate-400 mt-2">instagram: smartcareofficial</p><p className="text-xs text-slate-400 mt-2">linkedin: smartcareofficial</p></div></div><div className="border-t border-slate-800 text-center py-5 text-xs text-slate-400">Powered by Inplant Training 2026</div></footer>

{symptomOpen&&<div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div className="bg-white rounded-3xl max-w-lg w-full p-6 relative"><button onClick={()=>{setSymptomOpen(false);setAnalysis(null)}} className="absolute top-5 right-5 text-slate-400"><Icon name="x"/></button><div className="flex gap-3 items-center"><div className="bg-brand-100 text-brand-600 p-3 rounded-2xl"><Icon name="bot" size={24}/></div><div><h3 className="font-bold text-lg">AI Symptom Assistant</h3><p className="text-xs text-slate-500">Describe what you are experiencing.</p></div></div><textarea rows="4" value={symptoms} onChange={e=>setSymptoms(e.target.value)} placeholder="e.g. migraine, dizziness and numbness..." className="w-full p-3 border rounded-xl text-sm mt-4"/><button onClick={analyze} className="w-full bg-brand-600 text-white font-semibold py-2.5 rounded-xl mt-3">Analyze Symptoms</button>{analysis&&<div className="bg-brand-50 border border-brand-100 p-4 rounded-2xl mt-4"><div className="flex justify-between text-xs font-bold text-brand-700"><span>RECOMMENDATION</span><span>{analysis.confidence}% Match</span></div><p className="text-sm font-semibold mt-2">We recommend consulting a <span className="text-brand-600">{analysis.specialty}</span> specialist.</p><button onClick={()=>{setSpecialty(analysis.specialty);setSymptomOpen(false);setAnalysis(null);setTab("search")}} className="w-full bg-brand-600 text-white text-xs font-bold py-2 rounded-lg mt-3">View {analysis.specialty} Specialists</button></div>}</div></div>}

{booking&&<div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div className="bg-white rounded-3xl max-w-md w-full p-6 relative">{processing?<div className="py-14 text-center"><div className="w-10 h-10 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto"></div><p className="text-sm font-semibold mt-3">Processing UPI / Card Gateway...</p></div>:<><button onClick={()=>setBooking(null)} className="absolute top-5 right-5"><Icon name="x"/></button><h3 className="font-bold text-lg">Book & Pay Consultation</h3><p className="text-xs text-slate-500">With {booking.name} ({booking.specialty})</p><form onSubmit={book} className="space-y-4 mt-4"><input type="date" required value={date} onChange={e=>setDate(e.target.value)} className="w-full p-2.5 border rounded-xl text-sm"/><select value={time} onChange={e=>setTime(e.target.value)} className="w-full p-2.5 border rounded-xl text-sm"><option>09:00 AM</option><option>10:00 AM</option><option>02:30 PM</option><option>04:00 PM</option></select><textarea value={bookingSymptoms} onChange={e=>setBookingSymptoms(e.target.value)} placeholder="Symptoms / reason for visit" className="w-full p-2.5 border rounded-xl text-sm"/><div className="grid grid-cols-2 gap-2"><button type="button" onClick={()=>setPayOnline(true)} className={`p-2.5 rounded-xl border text-xs font-bold ${payOnline?"border-brand-600 bg-brand-50 text-brand-700":""}`}>Pay Online ₹{booking.fee}</button><button type="button" onClick={()=>setPayOnline(false)} className={`p-2.5 rounded-xl border text-xs font-bold ${!payOnline?"border-brand-600 bg-brand-50 text-brand-700":""}`}>Pay at Clinic</button></div>{payOnline&&<input required placeholder="UPI ID or Card Number" className="w-full p-2.5 border rounded-xl text-xs"/>}<div className="flex justify-end gap-2"><button type="button" onClick={()=>setBooking(null)} className="px-4 py-2 text-sm">Cancel</button><button className="px-5 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold">{payOnline?`Pay ₹${booking.fee} & Book`:"Confirm Booking"}</button></div></form></>}</div></div>}

{rating&&<div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div className="bg-white rounded-3xl max-w-md w-full p-6 relative"><button onClick={()=>setRating(null)} className="absolute top-5 right-5"><Icon name="x"/></button><h3 className="font-bold text-lg">Rate Your Experience</h3><p className="text-xs text-slate-500">With {rating.doctor}</p><form onSubmit={submitReview} className="mt-5"><div className="flex gap-2">{[1,2,3,4,5].map(s=><button type="button" key={s} onClick={()=>setStars(s)} className={`p-2 rounded-lg ${stars>=s?"text-amber-500 bg-amber-50":"text-slate-300"}`}>★</button>)}</div><textarea required value={review} onChange={e=>setReview(e.target.value)} rows="4" placeholder="Share your experience..." className="w-full p-3 border rounded-xl text-sm mt-4"/><button className="w-full bg-brand-600 text-white font-bold py-2.5 rounded-xl text-xs mt-3">Submit Review</button></form></div></div>}
</div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
